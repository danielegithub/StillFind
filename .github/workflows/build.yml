name: Build StillFind

# Include modelli, Tesseract e lingue; verifica OCR e inferenza nell'app ricollocata.
# Avvio: scheda "Actions" -> "Build StillFind" -> "Run workflow".
#   - "Pubblica una nuova release" attivo: la versione sale da sola (ultimo tag v* + 1 sull'ultimo numero), il tag
#     si crea da solo e la pre-release esce con tutti i file.
#   - "Pubblica una nuova release" spento: solo la build di prova (nessun tag, nessuna release).
#   - Un tag v* creato a mano funziona ancora: la versione è quella del tag.
# Produce archivi compressi e installatori (Windows .exe, macOS .dmg, Linux .deb). Sono ALPHA: vedi packaging/ALPHA.txt.
on:
  workflow_dispatch:
    inputs:
      release:
        description: "Pubblica una nuova release (la versione sale da sola)"
        type: boolean
        default: false
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-22.04
    outputs:
      number: ${{ steps.v.outputs.number }}
      tag: ${{ steps.v.outputs.tag }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Numero di versione
        id: v
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            tag="${{ github.ref_name }}"; publish=true
          elif [ "${{ inputs.release }}" = "true" ]; then
            last=$(git tag --list 'v[0-9]*' --sort=-v:refname | head -1)
            if [ -z "$last" ]; then tag="v0.1.0"
            else
              base=${last#v}; base=${base%%-*}
              major=${base%%.*}; rest=${base#*.}; minor=${rest%%.*}; patch=${rest#*.}
              tag="v$major.$minor.$((patch + 1))"
            fi
            publish=true
          else
            tag=""; publish=false
          fi
          number=${tag#v}
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "Versione: ${number:-(prova, nessuna release)}"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Librerie Tk e motore OCR per la build (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk tk-dev xvfb tesseract-ocr
      - name: Motore OCR per la build (macOS)
        if: runner.os == 'macOS'
        run: brew install tesseract
      - name: Motore OCR per la build (Windows)
        if: runner.os == 'Windows'
        run: choco install tesseract --yes --no-progress
      - name: Numero di versione nell'app e negli installatori
        if: needs.version.outputs.number != ''
        shell: python
        run: |
          import pathlib, re
          p = pathlib.Path("stillfind/core/about.py")
          p.write_text(re.sub(r'__version__ = "[^"]*"', '__version__ = "${{ needs.version.outputs.number }}"', p.read_text(encoding="utf-8")), encoding="utf-8")
      - name: Dipendenze
        run: python -m pip install -r requirements-build.txt
      - name: Modelli e lingue OCR con verifica SHA-256
        run: python packaging/prepare_assets.py
      - name: Costruzione e verifica offline
        if: runner.os != 'Linux'
        run: python build.py
      - name: Costruzione e verifica offline (Linux con display virtuale)
        if: runner.os == 'Linux'
        run: xvfb-run -a python build.py
      - name: Archivio (macOS)
        if: runner.os == 'macOS'
        run: cd dist && ditto -c -k --sequesterRsrc --keepParent StillFind.app StillFind-macos.zip
      - name: Archivio (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/StillFind -DestinationPath dist/StillFind-windows.zip
      - name: Archivio (Linux)
        if: runner.os == 'Linux'
        run: cd dist && tar czf StillFind-linux.tar.gz StillFind
      - name: Icone degli installatori
        run: python packaging/make_icons.py build/icons
      - name: Installatore (Windows, Inno Setup)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          $v = (python -c "from stillfind.core.about import __version__; print(__version__)").Trim()
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" "/DSourceDir=$PWD\dist\StillFind" "/DIconFile=$PWD\build\icons\stillfind.ico" packaging\windows\stillfind.iss
      - name: Immagine disco (macOS)
        if: runner.os == 'macOS'
        run: sh packaging/macos/build_dmg.sh
      - name: Pacchetto .deb (Linux)
        if: runner.os == 'Linux'
        run: |
          v=$(python -c "from stillfind.core.about import __version__; print(__version__)")
          sh packaging/linux/build_deb.sh "$v" build/icons/stillfind.png
      - uses: actions/upload-artifact@v4
        with:
          name: StillFind-${{ runner.os }}
          if-no-files-found: error
          path: |
            dist/StillFind-macos.zip
            dist/StillFind-macos.dmg
            dist/StillFind-windows.zip
            dist/StillFind-windows-setup.exe
            dist/StillFind-linux.tar.gz
            dist/stillfind_*_amd64.deb
      - name: Rapporto di verifica del pacchetto
        uses: actions/upload-artifact@v4
        with:
          name: StillFind-verifica-${{ runner.os }}
          path: dist/bundle-report.json
          if-no-files-found: error

  release:
    # Pre-release con tutti i file; il tag, se manca, lo crea GitHub. Nessuna firma del codice: vedi README.
    if: needs.version.outputs.publish == 'true'
    needs: [version, build]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: StillFind-*
          path: release
          merge-multiple: true
      - name: Pre-release su GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -f release/bundle-report.json
          gh release create "${{ needs.version.outputs.tag }}" release/* --prerelease --target "${{ github.sha }}" \
            --title "StillFind ${{ needs.version.outputs.tag }} (alpha)" \
            --notes-file packaging/RELEASE_NOTES_ALPHA.md
